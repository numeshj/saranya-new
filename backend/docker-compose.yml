services:
  mysql:
    image: mysql:8.4
    container_name: saranya_mysql
    environment:
      MYSQL_ROOT_PASSWORD: 228646
      MYSQL_DATABASE: saranya
    ports:
      - "3306:3306"
    volumes:
      - saranya_mysqldata:/var/lib/mysql

  redis:
    image: redis:7
    container_name: saranya_redis
    ports:
      - "6379:6379"

volumes:
  saranya_mysqldata:
